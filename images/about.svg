<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="ab1">
  <title id="ab1">Mercy Habesha Gold store display in Deira Gold Souk</title>
  <defs>
    <radialGradient id="abBg" cx="0.5" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#3a2f26"/><stop offset="0.55" stop-color="#20180f"/><stop offset="1" stop-color="#0d0a07"/>
    </radialGradient>
    <radialGradient id="abSpot" cx="0.5" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#f2cf8e" stop-opacity="0.4"/><stop offset="1" stop-color="#f2cf8e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="abGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E2AE"/><stop offset="0.45" stop-color="#D6AD5F"/><stop offset="1" stop-color="#8C6A3F"/>
    </linearGradient>
    <radialGradient id="abShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.5"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="640" fill="url(#abBg)"/>
  <rect width="800" height="640" fill="url(#abSpot)"/>

  <!-- arched niche -->
  <path d="M270 560 V330 C270 230 330 175 400 175 C470 175 530 230 530 330 V560 Z"
        fill="none" stroke="url(#abGold)" stroke-width="3"/>
  <path d="M292 560 V332 C292 244 340 200 400 200 C460 200 508 244 508 332 V560"
        fill="none" stroke="url(#abGold)" stroke-opacity="0.5" stroke-width="1.4"/>

  <ellipse cx="400" cy="585" rx="150" ry="18" fill="url(#abShadow)"/>

  <!-- hanging display jewelry -->
  <g transform="translate(340,255)">
    <path d="M0 0 L0 22" stroke="url(#abGold)" stroke-width="3"/>
    <path d="M-28 22 C-28 58, 28 58, 28 22 Z" fill="url(#abGold)"/>
  </g>
  <g transform="translate(400,238)">
    <path d="M0 0 L0 26" stroke="url(#abGold)" stroke-width="3"/>
    <circle cx="0" cy="42" r="16" fill="none" stroke="url(#abGold)" stroke-width="7"/>
  </g>
  <g transform="translate(460,255)">
    <path d="M0 0 L0 22" stroke="url(#abGold)" stroke-width="3"/>
    <path d="M-28 22 C-28 58, 28 58, 28 22 Z" fill="url(#abGold)"/>
  </g>

  <!-- display shelf -->
  <rect x="325" y="400" width="150" height="7" rx="3" fill="url(#abGold)" opacity="0.9"/>
  <g fill="url(#abGold)">
    <circle cx="352" cy="424" r="11"/>
    <circle cx="400" cy="420" r="14"/>
    <circle cx="448" cy="424" r="11"/>
  </g>

  <g fill="#F6E2AE">
    <circle cx="300" cy="230" r="2" opacity="0.7"/>
    <circle cx="510" cy="260" r="1.6" opacity="0.6"/>
    <circle cx="530" cy="180" r="1.4" opacity="0.5"/>
  </g>
</svg>
