<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="cd1">
  <title id="cd1">Custom Ethiopian gold jewelry design sketch</title>
  <defs>
    <linearGradient id="cdGold" x1="0" y1="0" x2="700" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E7C77D"/><stop offset="0.55" stop-color="#C9A24B"/><stop offset="1" stop-color="#8C6A3F"/>
    </linearGradient>
    <filter id="cdShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3a2e1a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="700" height="560" fill="#F4EEE1"/>
  <g filter="url(#cdShadow)">
    <rect x="90" y="70" width="520" height="420" rx="10" fill="#FAF6EE" stroke="url(#cdGold)" stroke-width="1.5"/>
  </g>
  <!-- blueprint guide circle -->
  <circle cx="350" cy="280" r="150" fill="none" stroke="#C9A24B" stroke-opacity="0.25" stroke-dasharray="3 8"/>
  <line x1="350" y1="130" x2="350" y2="430" stroke="#C9A24B" stroke-opacity="0.2" stroke-dasharray="3 8"/>
  <line x1="200" y1="280" x2="500" y2="280" stroke="#C9A24B" stroke-opacity="0.2" stroke-dasharray="3 8"/>

  <!-- necklace sketch -->
  <path d="M270 210 C 300 260, 400 260, 430 210" fill="none" stroke="url(#cdGold)" stroke-width="3" stroke-linecap="round"/>
  <path d="M350 258 L 325 330 C 325 365, 375 365, 375 330 Z" fill="none" stroke="url(#cdGold)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- pencil -->
  <g transform="translate(470,340) rotate(-35)">
    <rect x="0" y="0" width="14" height="90" rx="3" fill="url(#cdGold)"/>
    <path d="M0 90 L7 112 L14 90 Z" fill="#3a2e1a" fill-opacity="0.5"/>
  </g>

  <!-- initials monogram -->
  <text x="230" y="400" font-family="Georgia, serif" font-size="30" fill="url(#cdGold)" opacity="0.85">A &amp; M</text>
</svg>
