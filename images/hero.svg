<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Elegant Ethiopian gold jewelry, studio still life</title>
  <defs>
    <radialGradient id="heroBg" cx="0.5" cy="0.38" r="0.85">
      <stop offset="0" stop-color="#3a2f26"/>
      <stop offset="0.55" stop-color="#20180f"/>
      <stop offset="1" stop-color="#0d0a07"/>
    </radialGradient>
    <radialGradient id="heroSpot" cx="0.5" cy="0.32" r="0.42">
      <stop offset="0" stop-color="#f2cf8e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f2cf8e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E2AE"/>
      <stop offset="0.45" stop-color="#D6AD5F"/>
      <stop offset="1" stop-color="#8C6A3F"/>
    </linearGradient>
    <linearGradient id="heroGoldSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9CD8D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9C7A47" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#heroBg)"/>
  <rect width="1600" height="1200" fill="url(#heroSpot)"/>

  <!-- base shadow -->
  <ellipse cx="800" cy="920" rx="360" ry="60" fill="url(#shadowGrad)"/>

  <!-- necklace chain -->
  <path d="M540 330 C 620 440, 700 480, 800 480 C 900 480, 980 440, 1060 330"
        fill="none" stroke="url(#heroGold)" stroke-width="7" stroke-linecap="round"/>
  <g fill="url(#heroGold)">
    <circle cx="540" cy="330" r="9"/>
    <circle cx="583" cy="384" r="8"/>
    <circle cx="630" cy="424" r="8"/>
    <circle cx="682" cy="454" r="8"/>
    <circle cx="740" cy="472" r="8"/>
    <circle cx="800" cy="478" r="9"/>
    <circle cx="860" cy="472" r="8"/>
    <circle cx="918" cy="454" r="8"/>
    <circle cx="970" cy="424" r="8"/>
    <circle cx="1017" cy="384" r="8"/>
    <circle cx="1060" cy="330" r="9"/>
  </g>

  <!-- pendant with faceted gem -->
  <path d="M800 478 L 745 610 C 745 690, 855 690, 855 610 Z" fill="url(#heroGold)"/>
  <path d="M800 478 L 770 560 L 830 560 Z" fill="#FCEFC7" opacity="0.55"/>
  <path d="M770 560 L 830 560 L 810 620 L 790 620 Z" fill="#7C5C33" opacity="0.4"/>
  <circle cx="800" cy="520" r="14" fill="#FAF6EE" opacity="0.7"/>

  <!-- earrings -->
  <g transform="translate(400,650)">
    <circle cx="0" cy="0" r="7" fill="url(#heroGold)"/>
    <path d="M0 7 C -22 45, -22 110, 0 145 C 22 110, 22 45, 0 7 Z" fill="url(#heroGoldSoft)"/>
    <ellipse cx="0" cy="70" rx="8" ry="16" fill="#FAF6EE" opacity="0.35"/>
  </g>
  <g transform="translate(1200,650)">
    <circle cx="0" cy="0" r="7" fill="url(#heroGold)"/>
    <path d="M0 7 C -22 45, -22 110, 0 145 C 22 110, 22 45, 0 7 Z" fill="url(#heroGoldSoft)"/>
    <ellipse cx="0" cy="70" rx="8" ry="16" fill="#FAF6EE" opacity="0.35"/>
  </g>

  <!-- sparkle accents -->
  <g fill="#F6E2AE">
    <circle cx="700" cy="360" r="2.4" opacity="0.9"/>
    <circle cx="930" cy="400" r="1.8" opacity="0.7"/>
    <circle cx="600" cy="560" r="2" opacity="0.6"/>
    <circle cx="1010" cy="580" r="2.6" opacity="0.8"/>
    <circle cx="800" cy="640" r="1.6" opacity="0.5"/>
  </g>

  <!-- soft vignette corners -->
  <rect width="1600" height="1200" fill="url(#shadowGrad)" opacity="0.25" filter="url(#softBlur)"/>
</svg>
